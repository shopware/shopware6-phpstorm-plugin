# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.github.shyim.shopware6
pluginName=shopware6-phpstorm-plugin
pluginVersion=0.1.2

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# for insight into build numbers and IntelliJ Platform versions.
pluginSinceBuild=262
pluginUntilBuild=263.*

# Plugin Verifier integration -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-extension.html#plugin-verification
# See https://jb.gg/intellij-platform-builds-list for available build versions.
# Verify each supported PhpStorm release, including 2026.3.
pluginVerifierIdeVersions=PS-2026.2,PS-2026.3
platformType=IU
platformVersion=2026.1
platformDownloadSources=true

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.intellij.java, com.jetbrains.php:203.4449.22
platformPlugins=com.jetbrains.php:261.22158.208,com.jetbrains.twig:261.22158.185,fr.adrienbrault.idea.symfony2plugin:2026.1.308,de.espend.idea.php.annotation:12.1.0

# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins = JavaScript,org.jetbrains.plugins.yaml,org.jetbrains.plugins.sass

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.2.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
